name: Verify workflows

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        type: choice
        default: both
        options:
          - test
          - build
          - both

  workflow_call:
    inputs:
      action:
        required: false
        type: string
        default: both

permissions:
  contents: read

jobs:
  verify-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run tests
        if: ${{ inputs.action == 'test' || inputs.action == 'both' }}
        uses: ./.github/actions/test
        with:
          coverage: true

      - name: Build package
        if: ${{ inputs.action == 'build' || inputs.action == 'both' }}
        uses: ./.github/actions/build
        with:
          publish: false
