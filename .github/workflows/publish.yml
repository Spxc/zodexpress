name: Publish Package to npmjs
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    if: |
          contains(github.event.head_commit.message, 'chore(main): release zodexpress')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Publish package
        uses: ./.github/actions/build
        with:
          publish: true
          npm-token: ${{ secrets.NPM_TOKEN }}
