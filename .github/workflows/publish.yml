name: Publish Package to npmjs
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Publish package
        uses: ./.github/actions/build
        with:
          publish: true
          npm-token: ${{ secrets.NPM_TOKEN }}
