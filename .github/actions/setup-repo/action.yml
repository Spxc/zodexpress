name: Setup repo
description: "Install node, pnpm and dependencies"

inputs:
  skip-install:
    description: Skip dependency install step. Boolean string
    required: false
    default: "false"
  cache:
    description: cache package manager. Same as for setup-node action. Empty string to skip
    required: false
    default: "pnpm"
  registry-url:
    description: NPM registry url
    required: false

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      run: npm i -g pnpm@v10.7.1
      shell: bash

    - uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"
        cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      if: ${{ inputs.skip-install != 'true' }}
      run: pnpm install --frozen-lockfile
      shell: bash
